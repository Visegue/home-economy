packages:
  - packages/*

allowBuilds:
  # Required by Vite and Drizzle Kit. Keep the allowlist explicit.
  esbuild: true
  sharp: false
  unrs-resolver: false

overrides:
  # Update with better-auth: the adapter's core peer must match the runtime.
  "@better-auth/core": 1.7.16
  # Security patches for shadcn's transitive dependencies.
  "brace-expansion@5": 5.0.12
  esbuild: 0.28.2
  "fast-uri@3": 3.1.9
  "hono@4": 4.13.7
  ip-address: 10.7.4
  qs: 6.16.0
  "undici@7": 7.30.1
  "vite@8": 8.2.4
