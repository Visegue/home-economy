version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The CLI and runtime share internal packages and must upgrade together.
      better-auth:
        patterns:
          - "auth"
          - "better-auth"
          - "@better-auth/*"
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
