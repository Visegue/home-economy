name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep every main deployment and its corresponding release in order. PR runs
# remain independent, and pending main runs are queued rather than replaced.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-release' || github.run_id }}
  queue: max

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate app version
        run: pnpm check:version
      - name: Enforce PR version bump
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        run: node scripts/check-pr-version.mjs
      - name: Verify committed Drizzle migrations
        run: |
          pnpm db:generate
          migration_changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [ -n "$migration_changes" ]; then
            echo "::error::Databasschemat har ändrats utan motsvarande incheckad Drizzle-migration."
            echo "$migration_changes"
            exit 1
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: DATABASE_PROVIDER=pglite PGLITE_DATA_DIR=memory:// pnpm db:migrate
      - run: pnpm build
        env:
          # Build imports auth/database configuration but does not query Postgres.
          DATABASE_URL: postgresql://build:unused@127.0.0.1:5432/build_only
          # Synthetic build-only key; this artifact is never deployed.
          BETTER_AUTH_SECRET: synthetic-ci-build-secret-not-for-deployment

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [quality, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    # All previews currently share the development database.
    concurrency:
      group: staging-database-deployment
      cancel-in-progress: false
    steps:
      # Use the same PR merge commit that quality and end-to-end tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate preview configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for variable in DATABASE_URL DATABASE_MIGRATION_URL VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable saknas i GitHub-miljön staging."
              missing=1
            fi
          done
          exit "$missing"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply preview migrations
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
        run: pnpm db:migrate
      - name: Verify preview database
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm db:check
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node scripts/deploy-preview.mjs
      - name: Smoke test preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke-deployment.mjs

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.stage.outputs.url }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for variable in DATABASE_URL DATABASE_MIGRATION_URL VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable saknas i GitHub-miljön production."
              missing=1
            fi
          done
          exit "$missing"
      - name: Stage production deployment
        id: stage
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@59.16.0 deploy --prod --skip-domain --yes --no-color \
            --env APP_DEPLOY_ENV=production \
            --env "APP_DEPLOY_SHA=$GITHUB_SHA" \
            --env APP_DEPLOY_BRANCH=main \
            --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Apply production migrations
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
        run: pnpm db:migrate
      - name: Verify production database
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm db:check
      - name: Smoke test staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: node scripts/smoke-deployment.mjs
      - name: Promote production deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          deployment_host="${DEPLOYMENT_URL#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          deployment_id="$(jq --raw-output '.id // empty' <<< "$deployment_json")"
          deployment_project_id="$(jq --raw-output '.projectId // empty' <<< "$deployment_json")"

          if [ -z "$deployment_id" ] || [ "$deployment_project_id" != "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Den staged deploymenten kunde inte verifieras mot Vercel-projektet."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$deployment_id?teamId=$VERCEL_ORG_ID" \
            >/dev/null

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -er '.version' package.json)"
          tag="v$version"
          core_version="${version%%+*}"
          release_flags=()
          if [[ "$core_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$release_is_draft" = true ]; then
              echo "::error::$tag finns redan som utkast. Publicera eller ta bort utkastet manuellt efter granskning."
              exit 1
            fi
            echo "$tag finns redan som publicerad release. Ingen ny release behövs."
            exit 0
          fi

          if tag_target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag pekar inte på den deployade committen. Ingen release skapades."
              exit 1
            fi
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes "${release_flags[@]}"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes "${release_flags[@]}"
          fi
