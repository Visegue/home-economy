name: Preview migration gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow runs from the trusted base branch. Never check out or execute
# pull-request code here: it must not expose environment secrets to forks.
permissions:
  pull-requests: read

jobs:
  external-migration-gate:
    name: Preview migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unverified database or release changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            echo 'Trusted branch: Deploy preview is the migration check.'
            exit 0
          fi

          if [ "$CHANGED_FILE_COUNT" -gt 3000 ]; then
            echo '::error::The pull request exceeds GitHub’s 3000-file listing limit and needs a trusted staging run.'
            exit 1
          fi

          changed_files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if grep -Eq '^(drizzle/|drizzle\.config\.ts$|src/db/|src/lib/auth(/|\.ts$)|src/app/api/auth/|scripts/|\.github/|package\.json$|pnpm-lock\.yaml$|next\.config\.ts$|vercel\.json$)' <<< "$changed_files"; then
            echo '::error::Database, auth, dependency or release changes from a fork/Dependabot cannot be merged without Neon staging validation. After reviewing the code, reopen the change from a trusted branch in this repository.'
            exit 1
          fi

          echo 'No database or release files changed; isolated CI tests are sufficient.'
