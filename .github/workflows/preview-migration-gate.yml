name: Preview migration gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow runs from the trusted base branch. Never check out or execute
# pull-request code here: it must not expose environment secrets to forks.
permissions:
  pull-requests: read

jobs:
  external-migration-gate:
    name: Preview migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unverified database or release changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            echo 'Trusted branch: Deploy preview is the migration check.'
            exit 0
          fi

          if [ "$CHANGED_FILE_COUNT" -gt 3000 ]; then
            echo '::error::The pull request exceeds GitHub’s 3000-file listing limit and needs a trusted staging run.'
            exit 1
          fi

          changed_files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if grep -Eq '^(drizzle/|src/db/|src/lib/auth(/|\.ts$)|src/app/api/auth/|scripts/|\.github/|pnpm-(lock|workspace)\.yaml$|(next|drizzle|postcss|tailwind)\.config\.[cm]?[jt]s$|vercel\.json$|(proxy|middleware|instrumentation(-client)?)\.[cm]?[jt]sx?$|tsconfig(\.[^/]+)?\.json$|\.(npmrc|node-version|nvmrc)$)' <<< "$changed_files"; then
            echo '::error::Database, auth, dependency or release changes from a fork/Dependabot cannot be merged without Neon staging validation. After reviewing the code, reopen the change from a trusted branch in this repository.'
            exit 1
          fi

          # External app contributions need a version bump, but only the
          # version field may change without a trusted staging run.
          if grep -Fxq 'package.json' <<< "$changed_files"; then
            base_package="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$BASE_SHA" --jq '.content' | base64 -d | jq -cS 'del(.version)')"
            head_package="$(gh api "repos/$HEAD_REPOSITORY/contents/package.json?ref=$HEAD_SHA" --jq '.content' | base64 -d | jq -cS 'del(.version)')"
            if [ "$base_package" != "$head_package" ]; then
              echo '::error::Fork/Dependabot PRs may only change the version field in package.json without a trusted staging run.'
              exit 1
            fi
          fi

          echo 'No database or release files changed; isolated CI tests are sufficient.'
