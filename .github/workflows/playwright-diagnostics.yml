name: Verify Playwright diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/playwright-diagnostics.yml"
      - ".github/workflows/ci.yml"
      - ".github/scripts/summarize-playwright.mjs"
      - ".github/fixtures/playwright/**"
      - "playwright.config.ts"
      - "scripts/playwright-diagnostics.test.mjs"
      - "scripts/server-diagnostics*"

permissions:
  contents: read

jobs:
  diagnostics-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - name: Run isolated successful retry
        id: e2e
        run: node scripts/run-playwright.mjs test --config=.github/fixtures/playwright/playwright.config.ts
        env:
          DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}
          DIAGNOSTICS_SCENARIO: flaky
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-results/report.json
      - name: Summarize Playwright results
        id: e2e_report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        run: bun .github/scripts/summarize-playwright.mjs
      - name: Require retry diagnostic signal
        if: ${{ !cancelled() && steps.e2e_report.outputs.retain != 'true' }}
        run: exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && (failure() || steps.e2e_report.outputs.retain == 'true') }}
        with:
          name: playwright-diagnostics-contract-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
