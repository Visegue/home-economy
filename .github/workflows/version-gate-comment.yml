name: Version gate comment

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# The read job checks PR data with code from main. The write job never checks
# out or executes PR code, so forks cannot run code with a write token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: version-gate-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check PR version for comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Evaluate PR version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        run: node scripts/check-pr-version.mjs --report

  comment:
    name: Explain version gate
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Update version gate comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BLOCKED: ${{ needs.check-version.outputs.blocked }}
        run: |
          comment_id="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- home-economy-version-gate -->"))) | .id' \
            | head -n 1)"

          if [ "$BLOCKED" = true ]; then
            comment_body="$(printf '%s\n' \
              '<!-- home-economy-version-gate -->' \
              '⛔ **Versionsspärr:** `package.json.version` måste vara giltig SemVer. App- och releaseändringar kräver högre version än `main`. Rena dokumentations-, testfil- och CI-ändringar får behålla versionen.' \
              '' \
              'Format: `MAJOR.MINOR.PATCH`, med valfri prerelease (`-beta.1`) och byggmetadata (`+build.1`). Enbart byggmetadata höjer inte versionen. Dela PR:er med fler än 3000 ändrade filer så kontrollen kan köras. Se [release-runbooken](https://github.com/Visegue/home-economy/blob/main/docs/release-runbook.md).')"
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$comment_body" >/dev/null
            else
              gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$comment_body" >/dev/null
            fi
          elif [ -n "$comment_id" ]; then
            comment_body="$(printf '%s\n' \
              '<!-- home-economy-version-gate -->' \
              '✅ Versionsspärren är löst. Övriga obligatoriska kontroller gäller.')"
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$comment_body" >/dev/null
          fi
